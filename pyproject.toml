[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aigov"
version = "0.1.0"
description = "Heuristic governance scorecard for AI-assisted code (not legal advice, not a certification)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
aigov = "aigov.cli:main"

[tool.setuptools]
packages = ["aigov"]
